version: 1
metadata:
  skill_name: repo-standards
  source_category: first_party
interface:
  display_name: Repo Standards
  short_description: Use /repo-standards when reading, creating, updating, or aligning repo standards, enforcing the AGENTS.md router model, and migrating marketplace.json schema.
  default_prompt: Read references/repository-runbook-standard.md, then the repo's .agents/doctrine/repo-runbook-policy.md, then the specific local runbook. Use /repo-standards for repo shape, runbook layout, workflow order, and handoff requirements. Enforce the five-section root AGENTS.md router with resolvable routing pointers and canonical-topic coverage. Use scaffold-marketplace-json to migrate legacy marketplace.json keys into repo.local_skills. Use repo-worker-base for worktree, branch, validation, and publication. Route to the matching Superpowers skill for the stage.
policy:
  allow_implicit_invocation: true
