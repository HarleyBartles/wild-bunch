version: 1
metadata:
  skill_name: context-safety
  source_category: first_party
interface:
  display_name: Context Safety
  short_description: Use when a text write is expected to exceed the safe threshold, when a document is very large or context-heavy, or when a normal editor write path would be brittle.
  default_prompt: Use /context-safety when a text write is expected to exceed the safe threshold, when inline composition itself would risk consuming the remaining context, or when tool-call boundaries should be used as checkpoints. Estimate line count and byte size before writing, treat 2,000 lines per chunk as the target, 4,000 lines per chunk as the absolute red limit, and 1 MB of UTF-8 text as the byte ceiling, split writes expected to land around 1,500 lines or more into smaller chunks before composing, preserve durable state before `/compact`, use a clean-context worker/subagent or bounded append path for risky writes, validate the completed temp file, and atomically replace the target only after validation.
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
dependencies:
  tools: []
