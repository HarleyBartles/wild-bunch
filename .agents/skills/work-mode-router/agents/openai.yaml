  short_description: Use when a project session starts, resumes, or may involve repo/source work.
  default_prompt: Use /work-mode-router at the start of a project-scoped or workflow-sensitive session, when resuming with continuity or worktree state, or when the request may involve repo/source evidence, coding dispatch, workers, issues, artifacts, verification, skill work, mutation, or publication. Classify the request, preserve ordinary-chat escape hatches, then hand repo-backed work to /repo-worker-base and the matching baseline/local guide before /using-superpowers. Do not invoke /work-mode-router recursively after classification.
