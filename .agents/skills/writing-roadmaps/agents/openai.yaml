version: 1
metadata:
  skill_name: writing-roadmaps
  source_category: first_party
interface:
  display_name: Writing Roadmaps
  short_description: Decompose a large goal into a sequenced roadmap of plans.
  default_prompt: Use writing-roadmaps when a goal is too large for one writing-plans plan. Decompose the goal into a roadmap at `.agents/plans/<epic-name>/roadmap.md`, write plans just-in-time, run each plan through `handoff-gates` plan-readiness, and update the roadmap as you go.
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
