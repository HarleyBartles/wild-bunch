interface:
  display_name: Session Buster
  short_description: Produce cross-project GPT session continuity exports when the
    user asks for a session buster, bootstrap, handoff block, continuity summary,
    new-session transfer, or similar. When a handoff has a dominant next-step focus,
    include `suggested_next_session_name` as navigation metadata only. Use across
    projects to preserve verified state, fallback or conversation-derived state,
    running work, open queues, pending decisions, caveats, source/tool availability,
    and next-session verification instructions. Do not use for ordinary summaries,
    dispatches, or project-specific execution.
  brand_color: '#111827'
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
  default_prompt: Use $session-buster to produce a compact continuity export for the next session when a handoff or closeout is needed.
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
