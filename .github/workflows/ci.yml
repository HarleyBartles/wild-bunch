name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Canonical tracked commit gate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wildbunch_dev
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
            ~/.nuget/http-cache
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/WildBunch.Web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python script requirements
        run: python -m pip install -r scripts/requirements.txt

      - name: Install deployment Python requirements
        run: python -m pip install -r tools/deployment/requirements.txt

      - name: Run deployment unit tests
        run: python -m unittest discover -s tools/deployment/tests -v

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Validate Terraform roots without AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          for root in deploy/terraform/bootstrap deploy/terraform/environment; do
            terraform -chdir="$root" fmt -check -recursive
            terraform -chdir="$root" init -backend=false -lockfile=readonly
            terraform -chdir="$root" validate
            terraform -chdir="$root" test -no-color
          done

      - name: Render private Kubernetes overlays
        run: |
          kubectl kustomize deploy/kubernetes/overlays/local > /dev/null
          kubectl kustomize deploy/kubernetes/overlays/aws > /dev/null

      - name: Parse GitHub workflow YAML
        run: python -c "from pathlib import Path; import yaml; [yaml.load(path.read_text(encoding='utf-8'), Loader=yaml.BaseLoader) for path in Path('.github/workflows').glob('*.yml')]"

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          # actionlint v1.7.12 predates GitHub's concurrency queue keyword, so ignore only that schema mismatch.
          "$RUNNER_TEMP/actionlint" -ignore 'unexpected key "queue" for "concurrency" section' .github/workflows/*.yml

      - name: Validate tracked commit gate
        env:
          REPO_STANDARDS_HOSTED_COMMIT: HEAD
        run: githooks/pre-commit
